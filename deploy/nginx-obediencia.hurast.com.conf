# Domínio: obediencia.hurast.com
# Isolado do site Pokemon — não compartilha root, porta nem certificados.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name obediencia.hurast.com;

    root /var/www/obediencia/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/obediencia.hurast.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/obediencia.hurast.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HTML sempre revalida — assim o ?v= dos assets muda no celular após deploy
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ \.(mjs|js)$ {
        types { }
        default_type application/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name obediencia.hurast.com;
    return 301 https://$host$request_uri;
}
